services:
  - type: web
    name: big-odds-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Europe/London
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
